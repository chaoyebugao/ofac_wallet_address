name: Run OFAC Wallet Checker

on:
  schedule:
    - cron: '0 4 * * *'  # Run every day at 4:00 AM UTC
  workflow_dispatch:  # Allows manual trigger

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run the OFAC wallet checker script
      id: check
      run: python scripts/sdn-list-pull.py

    - name: Get current date
      if: steps.check.outputs.has_changes == 'true'
      id: date
      run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Create Release with wallet lists
      if: steps.check.outputs.has_changes == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ofac-wallets-${{ steps.date.outputs.date }}-${{ github.run_number }}-${{ github.run_id }}
        name: OFAC Sanctioned Wallets - ${{ steps.date.outputs.date }}
        body: |
          OFAC Sanctioned Wallet Lists
          Updated: ${{ steps.date.outputs.date }}
          Hash: ${{ steps.check.outputs.content_hash }}
        files: OFAC_Sanctioned_Wallet_Lists/*.txt
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
